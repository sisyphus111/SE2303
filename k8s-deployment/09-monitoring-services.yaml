---

# Notification Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: se2303-monitoring
  labels:
    app: notification-service
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: se2303/notification-service:latest  # 需要构建并推送到容器仓库
        ports:
        - containerPort: 8087
          name: http
        env:
        - name: SERVER_PORT
          value: "8087"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/notification_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
              optional: false
        envFrom:
        - configMapRef:
            name: database-config
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8087
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8087
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
---

apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: se2303-monitoring
  labels:
    app: notification-service
spec:
  ports:
  - port: 8087
    targetPort: 8087
    name: http
  selector:
    app: notification-service
  type: ClusterIP
---

# Inspection Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspection-service
  namespace: se2303-monitoring
  labels:
    app: inspection-service
    app.kubernetes.io/name: inspection-service
    app.kubernetes.io/component: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inspection-service
  template:
    metadata:
      labels:
        app: inspection-service
    spec:
      containers:
      - name: inspection-service
        image: se2303/inspection-service:latest  # 需要构建并推送到容器仓库
        ports:
        - containerPort: 8088
          name: http
        env:
        - name: SERVER_PORT
          value: "8088"
        envFrom:
        - configMapRef:
            name: database-config
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
---

apiVersion: v1
kind: Service
metadata:
  name: inspection-service
  namespace: se2303-monitoring
  labels:
    app: inspection-service
spec:
  ports:
  - port: 8088
    targetPort: 8088
    name: http
  selector:
    app: inspection-service
  type: ClusterIP 