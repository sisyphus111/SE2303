spring:
  application:
    name: community-service
  profiles:
    active: dev  # 默认激活开发环境
  datasource:
    url: jdbc:mysql://localhost:3306/community?createDatabaseIfNotExist=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD}
    hikari:  # 配置 HikariCP 连接池
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      repositories:
        enabled: true
      host: localhost
      port: 6379
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 1000
          max-idle: 100
          min-idle: 10
          max-wait: 200ms

# ElasticSearch配置（匹配start-elasticsearch.sh脚本）
elasticsearch:
  host: localhost
  port: 9201
  username: elastic
  password: ${DB_PASSWORD}
  cluster-name: docker-cluster

# 通知服务配置
inform:
  stream:
    key: user_inform_stream

  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 1000
  main:
    allow-bean-definition-overriding: true
server:
  port: 8083
feign:
  client:
    config:
      default:
        connectTimeout: 5000  # Feign 连接超时（毫秒）
        readTimeout: 5000     # Feign 读取超时（毫秒）
        loggerLevel: basic    # Feign 日志级别（可选：none, basic, headers, full）
management:
  endpoints:
    web:
      exposure:
        include: health,metrics  # 暴露 Actuator 端点
logging:
  level:
    root: INFO
    com.example.community: DEBUG  # CommunityService 包下的日志级别