---

# User Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: se2303-core-business
  labels:
    app: user-service
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: core-business
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: se2303/user-service:latest  # 需要构建并推送到容器仓库
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: SERVER_PORT
          value: "8082"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/mental_health_user?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
              optional: false
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: jwt-secret
        - name: JWT_EXPIRATION
          value: "86400000"
        - name: JWT_REFRESH_EXPIRATION
          value: "604800000"
        - name: APP_COOKIE_DOMAIN
          value: "your-domain.com"  # 需要替换为实际域名
        - name: APP_COOKIE_SECURE
          value: "true"
        - name: TENCENT_COS_SECRET_ID
          valueFrom:
            secretKeyRef:
              name: tencent-cos-secret
              key: secret-id
        - name: TENCENT_COS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tencent-cos-secret
              key: secret-key
        - name: JACCOUNT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: jaccount-secret
              key: client-id
        - name: JACCOUNT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: jaccount-secret
              key: client-secret
        envFrom:
        - configMapRef:
            name: database-config
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
---

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: se2303-core-business
  labels:
    app: user-service
spec:
  ports:
  - port: 8082
    targetPort: 8082
    name: http
  selector:
    app: user-service
  type: ClusterIP
---

# Community Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-service
  namespace: se2303-core-business
  labels:
    app: community-service
    app.kubernetes.io/name: community-service
    app.kubernetes.io/component: core-business
spec:
  replicas: 2
  selector:
    matchLabels:
      app: community-service
  template:
    metadata:
      labels:
        app: community-service
    spec:
      containers:
      - name: community-service
        image: se2303/community-service:latest  # 需要构建并推送到容器仓库
        ports:
        - containerPort: 8083
          name: http
        env:
        - name: SERVER_PORT
          value: "8083"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/community?createDatabaseIfNotExist=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
              optional: false
        - name: SPRING_DATA_REDIS_HOST
          value: "$(REDIS_HOST)"
        - name: SPRING_DATA_REDIS_PORT
          value: "$(REDIS_PORT)"
        - name: ELASTICSEARCH_HOST
          value: "$(ELASTICSEARCH_HOST)"
        - name: ELASTICSEARCH_PORT
          value: "$(ELASTICSEARCH_PORT)"
        - name: ELASTICSEARCH_USERNAME
          value: "elastic"
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-secret
              key: elastic-password
              optional: false
        envFrom:
        - configMapRef:
            name: database-config
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
---

apiVersion: v1
kind: Service
metadata:
  name: community-service
  namespace: se2303-core-business
  labels:
    app: community-service
spec:
  ports:
  - port: 8083
    targetPort: 8083
    name: http
  selector:
    app: community-service
  type: ClusterIP 