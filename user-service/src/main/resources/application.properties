spring.application.name=user-service

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/mental_user?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 将此服务运行在8082端口
server.port=8082

# JWT配置
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# 数据库初始化配置
app.data.init.enabled=true

# 腾讯云COS配置
tencent.cos.secret-id=${TENCENT_COS_SECRET_ID}
tencent.cos.secret-key=${TENCENT_COS_SECRET_KEY}
tencent.cos.region=ap-shanghai
tencent.cos.bucket-name=example-bucket
tencent.cos.domain=example.invalid

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# JAccount配置
jaccount.client-id=REDACTED
jaccount.client-secret=${JACCOUNT_CLIENT_SECRET}
jaccount.token-url=https://jaccount.sjtu.edu.cn/oauth2/token
jaccount.user-info-url=https://api.sjtu.edu.cn/v1/me/profile

# 内网穿透配置 - cpolar支持HTTP/HTTPS
app.cookie.domain=
app.cookie.secure=true