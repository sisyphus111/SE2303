server:
  port: 8081

spring:
  application:
    name: se2303-gateway
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/se2303_gateway?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  # OAuth2 Client配置 - JAccount OIDC
  security:
    oauth2:
      client:
        registration:
          jaccount:
            client-id: ${JACCOUNT_CLIENT_ID:your-client-id}
            client-secret: ${JACCOUNT_CLIENT_SECRET}
            scope: openid,profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: JAccount
        provider:
          jaccount:
            authorization-uri: https://jaccount.sjtu.edu.cn/oauth2/authorize
            token-uri: https://jaccount.sjtu.edu.cn/oauth2/token
            user-info-uri: https://api.sjtu.edu.cn/v1/me/profile
            jwk-set-uri: https://jaccount.sjtu.edu.cn/oauth2/jwks
            user-name-attribute: account
  
  cloud:
    gateway:
      # 全局CORS配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"  # 前端URL
              - "http://127.0.0.1:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 1728000  # 20天
      
      # 路由配置
      routes:
        # 认证相关路由 - 不需要转发，由网关直接处理
        - id: auth-login
          uri: no://op
          predicates:
            - Path=/api/auth/login
          filters:
            - name: RewritePath
              args:
                regexp: /api/auth/login
                replacement: /auth/login
        
        - id: auth-logout
          uri: no://op
          predicates:
            - Path=/api/auth/logout
          filters:
            - name: RewritePath
              args:
                regexp: /api/auth/logout
                replacement: /auth/logout
        
        - id: auth-user-info
          uri: no://op
          predicates:
            - Path=/api/auth/user
          filters:
            - name: RewritePath
              args:
                regexp: /api/auth/user
                replacement: /auth/user
        
        # 测试路由 - 简单的echo服务用于测试
        - id: test-echo
          uri: http://httpbin.org
          predicates:
            - Path=/api/test/**
          filters:
            - RewritePath=/api/test/(?<segment>.*), /${segment}
            - AddRequestHeader=X-Gateway-Source, se2303-gateway

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时 (毫秒)
  refresh-expiration: 604800000  # 7天 (毫秒)

# JAccount配置
jaccount:
  client-id: ${JACCOUNT_CLIENT_ID:your-client-id}
  client-secret: ${JACCOUNT_CLIENT_SECRET}
  redirect-uri: ${JACCOUNT_REDIRECT_URI:http://localhost:8081/api/auth/jaccount/callback}
  profile-api-url: https://api.sjtu.edu.cn/v1/me/profile

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.cors: DEBUG
    org.springframework.security: DEBUG
    com.se2303.gateway: DEBUG
    reactor.netty: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always 