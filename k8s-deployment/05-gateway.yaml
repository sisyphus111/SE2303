---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: se2303-gateway
  namespace: se2303-gateway
  labels:
    app: se2303-gateway
    app.kubernetes.io/name: se2303-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: se2303-gateway
  template:
    metadata:
      labels:
        app: se2303-gateway
    spec:
      containers:
      - name: gateway
        image: se2303/gateway:latest  # 需要构建并推送到容器仓库
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: jwt-secret
        envFrom:
        - configMapRef:
            name: gateway-config
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
---

apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: se2303-gateway
  labels:
    app: se2303-gateway
spec:
  ports:
  - port: 80
    targetPort: 8080
    name: http
  selector:
    app: se2303-gateway
  type: ClusterIP
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: se2303-gateway-ingress
  namespace: se2303-gateway
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/websocket-services: "gateway-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # 支持WebSocket连接
    nginx.ingress.kubernetes.io/upstream-hash-by: "$arg_token"
spec:
  rules:
  - host: your-domain.com  # 替换为您的实际域名
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 80
  tls:
  - hosts:
    - your-domain.com  # 替换为您的实际域名
    secretName: se2303-tls-secret  # 需要配置TLS证书 