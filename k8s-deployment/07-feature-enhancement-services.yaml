---

# Mood Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mood-service
  namespace: se2303-feature-enhancement
  labels:
    app: mood-service
    app.kubernetes.io/name: mood-service
    app.kubernetes.io/component: feature-enhancement
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mood-service
  template:
    metadata:
      labels:
        app: mood-service
    spec:
      containers:
      - name: mood-service
        image: se2303/mood-service:latest  # 需要构建并推送到容器仓库
        ports:
        - containerPort: 8085
          name: http
        env:
        - name: SERVER_PORT
          value: "8085"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/mood_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
              optional: false
        envFrom:
        - configMapRef:
            name: database-config
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8085
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8085
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
---

apiVersion: v1
kind: Service
metadata:
  name: mood-service
  namespace: se2303-feature-enhancement
  labels:
    app: mood-service
spec:
  ports:
  - port: 8085
    targetPort: 8085
    name: http
  selector:
    app: mood-service
  type: ClusterIP
---

# Alert Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: se2303-feature-enhancement
  labels:
    app: alert-service
    app.kubernetes.io/name: alert-service
    app.kubernetes.io/component: feature-enhancement
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-service
  template:
    metadata:
      labels:
        app: alert-service
    spec:
      containers:
      - name: alert-service
        image: se2303/alert-service:latest  # 需要构建并推送到容器仓库
        ports:
        - containerPort: 8086
          name: http
        env:
        - name: SERVER_PORT
          value: "8086"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/alert_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
              optional: false
        envFrom:
        - configMapRef:
            name: database-config
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
---

apiVersion: v1
kind: Service
metadata:
  name: alert-service
  namespace: se2303-feature-enhancement
  labels:
    app: alert-service
spec:
  ports:
  - port: 8086
    targetPort: 8086
    name: http
  selector:
    app: alert-service
  type: ClusterIP 