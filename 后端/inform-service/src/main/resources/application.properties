# 服务配置
server.port=8089
spring.application.name=inform-service

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/mental_health_inform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
#spring.data.redis.password=xmf57319952
spring.data.redis.database=0

# 日志配置
logging.level.com.se2303.informservice=DEBUG
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 通知配置
app.notification.queue.prefix=notifications
app.notification.queue.ttl=604800
app.notification.polling.enabled=true
app.notification.polling.interval=30000

# 通知服务配置
inform.queue.key=user_inform_queue
inform.expiry.days=30
user.service.url=http://localhost:8081

# Stream配置
inform.stream.key=user_inform_stream
inform.consumer.group=inform_consumer_group
inform.consumer.name=inform_consumer

# 启用定时任务
spring.task.scheduling.enabled=true
