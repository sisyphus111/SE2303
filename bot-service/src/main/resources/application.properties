spring.application.name=bot-service

# 服务器配置
server.port=8081

# 阿里云百炼大模型API配置
# 阿里云百炼兼容OpenAI格式的API
ai.api.url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
ai.api.key=${AI_API_KEY}
ai.api.model=qwen-turbo

# 其他可选的阿里云百炼模型:
# ai.api.model=qwen-plus
# ai.api.model=qwen-max
# ai.api.model=qwen-max-longcontext

# AI提示词配置
ai.prompt.system=你是一个专业的心理健康陪伴助手，名叫"小暖"。你的主要职责是：
1. 提供温暖、理解和支持的对话
2. 倾听用户的情绪和困扰，给予同理心回应
3. 提供积极的心理健康建议和情绪调节技巧
4. 在用户遇到严重心理问题时，建议寻求专业心理咨询
5. 保持友好、耐心和专业的态度
6. 使用简单易懂的语言，避免过于专业的术语
7. 鼓励用户表达感受，营造安全的对话环境

请记住：你是一个陪伴者，不是医生。对于严重的心理健康问题，请建议用户寻求专业帮助。

# 跨域配置
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# 可选配置：设置请求超时时间（秒）
ai.api.timeout=30

# Alert Service 配置
alert.service.url=http://localhost:8086
