server:
  port: 8080

spring:
  application:
    name: se2303-gateway
  
  cloud:
    gateway:
      # 全局CORS配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"  # 前端URL
              - "http://127.0.0.1:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 1728000  # 20天
      
      # 路由配置
      routes:
        # 用户服务路由 - 注册和登录不需要token验证
        - id: user-service-auth
          uri: http://localhost:8082
          predicates:
            - Path=/api/user/**
          filters:
            - RewritePath=/api/user/(?<segment>.*), /api/user/${segment}


        # 社区服务路由
        - id: community-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/community/**
          filters:
            - RewritePath=/api/community/(?<segment>.*), /api/community/${segment}

        # 心情服务路由
        - id: mood-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/mood/**
          filters:
            - RewritePath=/api/mood/(?<segment>.*), /api/mood/${segment}

        # 通知服务路由
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notification/**
          filters:
            - RewritePath=/api/notification/(?<segment>.*), /api/notification/${segment}

# JWT配置
jwt:
  secret: ${JWT_SECRET}

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.cors: DEBUG
    org.springframework.security: DEBUG
    com.se2303.gateway: DEBUG
    reactor.netty: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always 