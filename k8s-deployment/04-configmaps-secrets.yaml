# 网关配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: se2303-gateway
data:
  # 这里使用Kubernetes服务发现
  USER_SERVICE_HOST: "user-service.se2303-core-business.svc.cluster.local"
  USER_SERVICE_PORT: "8082"
  COMMUNITY_SERVICE_HOST: "community-service.se2303-core-business.svc.cluster.local"
  COMMUNITY_SERVICE_PORT: "8083"
  MOOD_SERVICE_HOST: "mood-service.se2303-feature-enhancement.svc.cluster.local"
  MOOD_SERVICE_PORT: "8085"
  ALERT_SERVICE_HOST: "alert-service.se2303-feature-enhancement.svc.cluster.local"
  ALERT_SERVICE_PORT: "8086"
  NOTIFICATION_SERVICE_HOST: "notification-service.se2303-monitoring.svc.cluster.local"
  NOTIFICATION_SERVICE_PORT: "8087"
  INSPECTION_SERVICE_HOST: "inspection-service.se2303-monitoring.svc.cluster.local"
  INSPECTION_SERVICE_PORT: "8088"
  TALK_SERVICE_HOST: "talk-service.se2303-realtime-communication.svc.cluster.local"
  TALK_SERVICE_PORT: "8090"
  BOT_SERVICE_HOST: "bot-service.se2303-realtime-communication.svc.cluster.local"
  BOT_SERVICE_PORT: "8081"
---

